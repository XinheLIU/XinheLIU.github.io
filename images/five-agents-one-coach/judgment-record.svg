<text x="450" y="604" font-size="11.5" fill="#5c6570" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">IA = Information Assistant · AKB = Agentic Knowledge Bank · LOS = Learning OS · WA = Writing Assistant</text>
<text x="450" y="630" font-size="13.5" fill="#e8eaec" text-anchor="middle">五个产品参与不同环节，但都把有效反馈沉淀进同一份记录：这比共用一份用户画像重要得多。</text>
