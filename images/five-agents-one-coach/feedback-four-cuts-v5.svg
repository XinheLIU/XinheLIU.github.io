<text x="690" y="214" font-size="15" fill="#e07a6b" font-weight="600">1  截断</text>
<text x="690" y="236" font-size="13" fill="#9aa3ad">测试在毕业那天被撤走，</text>
<text x="690" y="255" font-size="13" fill="#9aa3ad">再没人告诉你对不对</text>
<text x="690" y="280" font-size="13.5" fill="#aecbdd" font-weight="600">断在 · 检验</text>
<text x="690" y="300" font-size="12.5" fill="#5c6570">完成感代替了掌握</text>
<text x="220" y="214" font-size="15" fill="#e07a6b" font-weight="600" text-anchor="end">2  污染</text>
<text x="220" y="236" font-size="13" fill="#9aa3ad" text-anchor="end">平台的参与度目标</text>
<text x="220" y="255" font-size="13" fill="#9aa3ad" text-anchor="end">× 自己的动机性推理</text>
<text x="220" y="280" font-size="13.5" fill="#aecbdd" font-weight="600" text-anchor="end">断在 · 观察</text>
<text x="220" y="300" font-size="12.5" fill="#5c6570" text-anchor="end">越来越确定，也越来越窄</text>
<text x="560" y="456" font-size="15" fill="#e07a6b" font-weight="600">3  对象错误</text>
<text x="560" y="478" font-size="13" fill="#9aa3ad">只复盘做得好不好，</text>
<text x="560" y="497" font-size="13" fill="#9aa3ad">不复盘该不该做（单环）</text>
<text x="560" y="522" font-size="13.5" fill="#aecbdd" font-weight="600">断在 · 目标</text>
<text x="560" y="542" font-size="12.5" fill="#5c6570">单环在转，双环没有打开</text>
<text x="246" y="456" font-size="15" fill="#e07a6b" font-weight="600" text-anchor="end">4  无痕迹</text>
<text x="246" y="478" font-size="13" fill="#9aa3ad" text-anchor="end">反馈发生了，</text>
<text x="246" y="497" font-size="13" fill="#9aa3ad" text-anchor="end">却没有地方存放</text>
<text x="246" y="522" font-size="13.5" fill="#aecbdd" font-weight="600" text-anchor="end">断在 · 保存</text>
<text x="246" y="542" font-size="12.5" fill="#5c6570" text-anchor="end">下一次又从零开始</text>
<text x="450" y="590" font-size="13" fill="#9aa3ad" text-anchor="middle">四处断裂叠加：只收到确认，在未经审视的目标上越来越熟练，经历也没有沉淀下来。</text>
