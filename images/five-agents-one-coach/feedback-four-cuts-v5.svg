<text x="315" y="378" font-size="13" fill="#9aa3ad" text-anchor="middle">改方法，也改目标</text>
<text x="450" y="254" font-size="11.5" fill="#5c6570" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="1">学校里的反馈</text>
<text x="450" y="274" font-size="12.5" fill="#5c6570" text-anchor="middle">考试让它持续运转</text>
