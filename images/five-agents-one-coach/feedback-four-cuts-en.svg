<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" role="img" aria-labelledby="t d" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
<title id="t">The feedback loop breaks in four places; each cognitive product repairs one</title>
<desc id="d">Where does the feedback loop break after school? Each of the four cuts lands on one step of the loop, and each cognitive product repairs one of them.</desc>
<defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1" fill="#1a1f26"/></pattern><marker id="ar-aecbdd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#aecbdd"/></marker></defs>
<rect width="900" height="610" rx="12" fill="#0b0d10"/>
<rect width="900" height="610" rx="12" fill="url(#dots)"/>
<rect x="0.5" y="0.5" width="899" height="609" rx="12" fill="none" stroke="#2a2f36"/>
<rect x="32" y="31" width="9" height="9" fill="none" stroke="#aecbdd"/>
<text x="50" y="40" font-size="12" fill="#aecbdd" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="2">FIG 3 · FOUR CUTS, FOUR PRODUCTS</text>
<text x="32" y="72" font-size="21" font-weight="600" fill="#e8eaec">The feedback loop breaks in four places; each cognitive product repairs one</text>
<line x1="32" y1="90" x2="868" y2="90" stroke="#2a2f36"/>
<rect x="230" y="128" width="170" height="64" rx="6" fill="#101318" stroke="#3d444d" stroke-width="1.25"/>
<text x="315" y="156" font-size="17" fill="#e8eaec" font-weight="600" text-anchor="middle">Input</text>
<text x="315" y="178" font-size="13" fill="#9aa3ad" text-anchor="middle">take in the world</text>
<rect x="500" y="128" width="170" height="64" rx="6" fill="#101318" stroke="#3d444d" stroke-width="1.25"/>
<text x="585" y="156" font-size="17" fill="#e8eaec" font-weight="600" text-anchor="middle">Model</text>
<text x="585" y="178" font-size="13" fill="#9aa3ad" text-anchor="middle">form judgments</text>
<rect x="500" y="328" width="170" height="64" rx="6" fill="#101318" stroke="#3d444d" stroke-width="1.25"/>
<text x="585" y="356" font-size="17" fill="#e8eaec" font-weight="600" text-anchor="middle">Test</text>
<text x="585" y="378" font-size="13" fill="#9aa3ad" text-anchor="middle">check against reality</text>
<rect x="230" y="328" width="170" height="64" rx="6" fill="#101318" stroke="#3d444d" stroke-width="1.25"/>
<text x="315" y="356" font-size="17" fill="#e8eaec" font-weight="600" text-anchor="middle">Correct</text>
<text x="315" y="378" font-size="13" fill="#9aa3ad" text-anchor="middle">fix methods and goals</text>
<text x="450" y="254" font-size="11" fill="#5c6570" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="1">THE FEEDBACK LOOP AT SCHOOL</text>
<text x="450" y="274" font-size="12.5" fill="#5c6570" text-anchor="middle">exams keep it turning</text>
<path d="M400 160 H496" fill="none" stroke="#aecbdd" stroke-width="1.5" marker-end="url(#ar-aecbdd)"/>
<path d="M585 192 V244" fill="none" stroke="#aecbdd" stroke-width="1.5"/>
<path d="M585 272 V324" fill="none" stroke="#aecbdd" stroke-width="1.5" marker-end="url(#ar-aecbdd)"/>
<path d="M500 360 H464" fill="none" stroke="#aecbdd" stroke-width="1.5"/>
<path d="M436 360 H404" fill="none" stroke="#aecbdd" stroke-width="1.5" marker-end="url(#ar-aecbdd)"/>
<path d="M315 328 V276" fill="none" stroke="#aecbdd" stroke-width="1.5"/>
<path d="M315 248 V196" fill="none" stroke="#aecbdd" stroke-width="1.5" marker-end="url(#ar-aecbdd)"/>
<path d="M315 392 V410" fill="none" stroke="#aecbdd" stroke-width="1.5"/>
<path d="M315 438 V452" fill="none" stroke="#aecbdd" stroke-width="1.5" marker-end="url(#ar-aecbdd)"/>
<path d="M269 466 V500 A46 11 0 0 0 361 500 V466" fill="#101318" stroke="#e3c99a" stroke-width="1.4"/>
<ellipse cx="315" cy="466" rx="46" ry="11" fill="#e3c99a" fill-opacity="0.16" stroke="#e3c99a" stroke-width="1.4"/>
<text x="372" y="482" font-size="14" fill="#e3c99a" font-weight="600">Judgment history</text>
<text x="372" y="501" font-size="12.5" fill="#5c6570">where feedback belongs</text>
<circle cx="585" cy="258" r="12" fill="#0b0d10" stroke="#e07a6b" stroke-width="1.5"/>
<text x="585" y="262.5" font-size="13" fill="#e07a6b" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">1</text>
<circle cx="315" cy="262" r="12" fill="#0b0d10" stroke="#e07a6b" stroke-width="1.5"/>
<text x="315" y="266.5" font-size="13" fill="#e07a6b" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">2</text>
<circle cx="450" cy="360" r="12" fill="#0b0d10" stroke="#e07a6b" stroke-width="1.5"/>
<text x="450" y="364.5" font-size="13" fill="#e07a6b" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">3</text>
<circle cx="315" cy="424" r="12" fill="#0b0d10" stroke="#e07a6b" stroke-width="1.5"/>
<text x="315" y="428.5" font-size="13" fill="#e07a6b" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">4</text>
<path d="M598 256 L676 238" fill="none" stroke="#e07a6b" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M302 260 L228 238" fill="none" stroke="#e07a6b" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M458 371 L552 446" fill="none" stroke="#e07a6b" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M302 428 L256 450" fill="none" stroke="#e07a6b" stroke-width="1" stroke-dasharray="3 3"/>
<text x="684" y="214" font-size="15" fill="#e07a6b" font-weight="600">1  Cut-off</text>
<text x="684" y="236" font-size="13" fill="#9aa3ad">Tests end at graduation;</text>
<text x="684" y="255" font-size="13" fill="#9aa3ad">nobody grades you now</text>
<text x="684" y="280" font-size="13.5" fill="#aecbdd" font-weight="600">→ Learning OS</text>
<text x="684" y="300" font-size="12.5" fill="#5c6570">cold recall · sealed bank</text>
<text x="684" y="317" font-size="12.5" fill="#5c6570">delayed retests</text>
<text x="220" y="214" font-size="15" fill="#e07a6b" font-weight="600" text-anchor="end">2  Contamination</text>
<text x="220" y="236" font-size="13" fill="#9aa3ad" text-anchor="end">engagement-driven feeds</text>
<text x="220" y="255" font-size="13" fill="#9aa3ad" text-anchor="end">× motivated reasoning</text>
<text x="220" y="280" font-size="13.5" fill="#aecbdd" font-weight="600" text-anchor="end">→ Information Assistant</text>
<text x="220" y="300" font-size="12.5" fill="#5c6570" text-anchor="end">evidence grading</text>
<text x="220" y="317" font-size="12.5" fill="#5c6570" text-anchor="end">counter-evidence quota</text>
<text x="560" y="456" font-size="15" fill="#e07a6b" font-weight="600">3  Wrong target</text>
<text x="560" y="478" font-size="13" fill="#9aa3ad">reviewing how well,</text>
<text x="560" y="497" font-size="13" fill="#9aa3ad">never whether (single-loop)</text>
<text x="560" y="522" font-size="13.5" fill="#aecbdd" font-weight="600">→ Writing Assistant</text>
<text x="560" y="542" font-size="12.5" fill="#5c6570">turns the framework itself</text>
<text x="560" y="559" font-size="12.5" fill="#5c6570">into an object to examine</text>
<text x="246" y="456" font-size="15" fill="#e07a6b" font-weight="600" text-anchor="end">4  No trace</text>
<text x="246" y="478" font-size="13" fill="#9aa3ad" text-anchor="end">feedback happens, but</text>
<text x="246" y="497" font-size="13" fill="#9aa3ad" text-anchor="end">has nowhere to live</text>
<text x="246" y="522" font-size="13.5" fill="#aecbdd" font-weight="600" text-anchor="end">→ Agentic Knowledge Bank</text>
<text x="246" y="542" font-size="12.5" fill="#5c6570" text-anchor="end">sources · explicit gaps</text>
<text x="246" y="559" font-size="12.5" fill="#5c6570" text-anchor="end">evolving views</text>
<text x="450" y="592" font-size="13" fill="#9aa3ad" text-anchor="middle">"Veteran mode" = all four cuts: no correction, only confirmation, growing skill at wrong goals, no trace.</text>
</svg>
