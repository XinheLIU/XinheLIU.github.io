<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Not a pipeline, a loop</title>
<desc id="d">How do the four cognitive products connect into one machine? The main path runs from input to public challenge, and the return edges send the problems it exposes back to the start.</desc>
