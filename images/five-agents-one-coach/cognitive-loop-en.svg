<text x="463" y="396" font-size="13" fill="#aecbdd" text-anchor="middle">are written back as gaps</text>
<path d="M306 316 V400 Q306 410 296 410 H172 Q162 410 162 400 V320" fill="none" stroke="#aecbdd" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#ar-aecbdd)"/>
<text x="234" y="430" font-size="13" fill="#aecbdd" text-anchor="middle">Gaps decide what to read next</text>
<line x1="600" y1="390" x2="634" y2="390" stroke="#aecbdd" stroke-width="1.6"/>
<text x="642" y="395" font-size="12.5" fill="#5c6570">main path</text>
<line x1="720" y1="390" x2="754" y2="390" stroke="#aecbdd" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="762" y="395" font-size="12.5" fill="#5c6570">return edge</text>
<text x="450" y="476" font-size="13.5" fill="#e8eaec" text-anchor="middle">A pipeline runs one way; a loop has return paths: contact the world, build a model, accept correction.</text>
</svg>
