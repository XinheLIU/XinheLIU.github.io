<text x="50" y="40" font-size="12" fill="#aecbdd" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="2">FIG 4 · THE COGNITIVE MACHINE</text>
<text x="32" y="72" font-size="21" font-weight="600" fill="#e8eaec">Not a pipeline, a loop</text>
