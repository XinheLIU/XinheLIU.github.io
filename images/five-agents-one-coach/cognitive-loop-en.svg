<text x="48" y="228" font-size="15" fill="#e8eaec" font-weight="600">Assistant</text>
<text x="48" y="256" font-size="13.5" fill="#9aa3ad">Protect input</text>
<text x="48" y="276" font-size="11.5" fill="#aecbdd" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="1.5">CONNECT</text>
<text x="48" y="300" font-size="12" fill="#e07a6b" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">fixes: contamination</text>
<path d="M212 248 H254" fill="none" stroke="#aecbdd" stroke-width="1.6" marker-end="url(#ar-aecbdd)"/>
