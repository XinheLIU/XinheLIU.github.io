<text x="496" y="256" font-size="13.5" fill="#9aa3ad">Test and practice</text>
<text x="496" y="276" font-size="11.5" fill="#aecbdd" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="1.5">THINK</text>
<text x="496" y="300" font-size="12" fill="#e07a6b" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">fixes: cut-off</text>
