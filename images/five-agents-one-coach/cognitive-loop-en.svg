<text x="458" y="122" font-size="13" fill="#aecbdd" text-anchor="middle">Logic flaws exposed in writing become the next round's research questions</text>
<path d="M540 316 V348 Q540 358 530 358 H396 Q386 358 386 348 V320" fill="none" stroke="#aecbdd" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#ar-aecbdd)"/>
