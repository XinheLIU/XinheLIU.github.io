<text x="272" y="228" font-size="15" fill="#e8eaec" font-weight="600">Knowledge Bank</text>
<text x="272" y="256" font-size="13.5" fill="#9aa3ad">Externalize model</text>
<text x="272" y="276" font-size="11.5" fill="#aecbdd" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="1.5">KNOW</text>
<text x="272" y="300" font-size="12" fill="#e07a6b" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">fixes: no trace</text>
