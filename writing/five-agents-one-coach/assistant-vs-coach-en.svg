<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" role="img" aria-labelledby="t d" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Same technology, opposite objective functions</title>
<desc id="d">Faced with the same request, what do a waiter and a coach choose differently? Two objective functions take the same technology toward opposite long-term curves.</desc>
<defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1" fill="#1a1f26"/></pattern><marker id="ar-5c6570" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#5c6570"/></marker><marker id="ar-a78bfa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#a78bfa"/></marker></defs>
<rect width="900" height="670" rx="12" fill="#0b0d10"/>
<rect width="900" height="670" rx="12" fill="url(#dots)"/>
<rect x="0.5" y="0.5" width="899" height="669" rx="12" fill="none" stroke="#2a2f36"/>
<rect x="32" y="31" width="9" height="9" fill="none" stroke="#a78bfa"/>
<text x="50" y="40" font-size="12" fill="#a78bfa" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="2">FIG 6 · WAITER AND COACH</text>
<text x="32" y="72" font-size="21" font-weight="600" fill="#e8eaec">Same technology, opposite objective functions</text>
<line x1="32" y1="90" x2="868" y2="90" stroke="#2a2f36"/>
<text x="32" y="120" font-size="15" fill="#e8eaec" font-weight="600">Waiter · serves the stated need</text>
<text x="32" y="140" font-size="12.5" fill="#5c6570">optimizes: completion · fewer steps · stickiness</text>
<text x="450" y="120" font-size="15" fill="#e8eaec" font-weight="600" text-anchor="middle">Same request</text>
<text x="868" y="120" font-size="15" fill="#a78bfa" font-weight="600" text-anchor="end">Coach · questions the need</text>
<text x="868" y="140" font-size="12.5" fill="#5c6570" text-anchor="end">optimizes: independence · judgment · leverage</text>
<rect x="32" y="156" width="290" height="42" rx="4" fill="#101318" stroke="#2a2f36" stroke-width="1"/>
<text x="48" y="182" font-size="14" fill="#9aa3ad">Give a satisfying answer now</text>
<rect x="352" y="156" width="196" height="42" rx="21" fill="#0b0d10" stroke="#3d444d" stroke-width="1"/>
<text x="450" y="182" font-size="14" fill="#e8eaec" text-anchor="middle">I want an answer</text>
<rect x="578" y="156" width="290" height="42" rx="4" fill="#a78bfa" stroke="#a78bfa" stroke-width="1.2" fill-opacity="0.08"/>
<text x="594" y="182" font-size="14" fill="#e8eaec">Hold it; ask you to derive it</text>
<path d="M352 177 H326" fill="none" stroke="#5c6570" stroke-width="1.3" marker-end="url(#ar-5c6570)"/>
<path d="M548 177 H574" fill="none" stroke="#a78bfa" stroke-width="1.3" marker-end="url(#ar-a78bfa)"/>
<rect x="32" y="206" width="290" height="42" rx="4" fill="#101318" stroke="#2a2f36" stroke-width="1"/>
<text x="48" y="232" font-size="14" fill="#9aa3ad">Recommend more of the same</text>
<rect x="352" y="206" width="196" height="42" rx="21" fill="#0b0d10" stroke="#3d444d" stroke-width="1"/>
<text x="450" y="232" font-size="14" fill="#e8eaec" text-anchor="middle">I like this direction</text>
<rect x="578" y="206" width="290" height="42" rx="4" fill="#a78bfa" stroke="#a78bfa" stroke-width="1.2" fill-opacity="0.08"/>
<text x="594" y="232" font-size="14" fill="#e8eaec">Show the counter-evidence</text>
<path d="M352 227 H326" fill="none" stroke="#5c6570" stroke-width="1.3" marker-end="url(#ar-5c6570)"/>
<path d="M548 227 H574" fill="none" stroke="#a78bfa" stroke-width="1.3" marker-end="url(#ar-a78bfa)"/>
<rect x="32" y="256" width="290" height="42" rx="4" fill="#101318" stroke="#2a2f36" stroke-width="1"/>
<text x="48" y="282" font-size="14" fill="#9aa3ad">Plan all ten fields for you</text>
<rect x="352" y="256" width="196" height="42" rx="21" fill="#0b0d10" stroke="#3d444d" stroke-width="1"/>
<text x="450" y="282" font-size="14" fill="#e8eaec" text-anchor="middle">Teach me ten new fields</text>
<rect x="578" y="256" width="290" height="42" rx="4" fill="#a78bfa" stroke="#a78bfa" stroke-width="1.2" fill-opacity="0.08"/>
<text x="594" y="282" font-size="14" fill="#e8eaec">Master one problem first</text>
<path d="M352 277 H326" fill="none" stroke="#5c6570" stroke-width="1.3" marker-end="url(#ar-5c6570)"/>
<path d="M548 277 H574" fill="none" stroke="#a78bfa" stroke-width="1.3" marker-end="url(#ar-a78bfa)"/>
<rect x="32" y="306" width="290" height="42" rx="4" fill="#101318" stroke="#2a2f36" stroke-width="1"/>
<text x="48" y="332" font-size="14" fill="#9aa3ad">Push all ten forward at once</text>
<rect x="352" y="306" width="196" height="42" rx="21" fill="#0b0d10" stroke="#3d444d" stroke-width="1"/>
<text x="450" y="332" font-size="14" fill="#e8eaec" text-anchor="middle">Help me chase ten leads</text>
<rect x="578" y="306" width="290" height="42" rx="4" fill="#a78bfa" stroke="#a78bfa" stroke-width="1.2" fill-opacity="0.08"/>
<text x="594" y="332" font-size="14" fill="#e8eaec">Suggest dropping eight</text>
<path d="M352 327 H326" fill="none" stroke="#5c6570" stroke-width="1.3" marker-end="url(#ar-5c6570)"/>
<path d="M548 327 H574" fill="none" stroke="#a78bfa" stroke-width="1.3" marker-end="url(#ar-a78bfa)"/>
<rect x="32" y="356" width="290" height="42" rx="4" fill="#101318" stroke="#2a2f36" stroke-width="1"/>
<text x="48" y="382" font-size="14" fill="#9aa3ad">Give the encouragement asked</text>
<rect x="352" y="356" width="196" height="42" rx="21" fill="#0b0d10" stroke="#3d444d" stroke-width="1"/>
<text x="450" y="382" font-size="14" fill="#e8eaec" text-anchor="middle">Encourage me a little</text>
<rect x="578" y="356" width="290" height="42" rx="4" fill="#a78bfa" stroke="#a78bfa" stroke-width="1.2" fill-opacity="0.08"/>
<text x="594" y="382" font-size="14" fill="#e8eaec">No real progress in 3 months</text>
<path d="M352 377 H326" fill="none" stroke="#5c6570" stroke-width="1.3" marker-end="url(#ar-5c6570)"/>
<path d="M548 377 H574" fill="none" stroke="#a78bfa" stroke-width="1.3" marker-end="url(#ar-a78bfa)"/>
<text x="450" y="426" font-size="13" fill="#5c6570" text-anchor="middle">Friction on demand: fast service for lookups, unaided recall only in training mode. The human turns the dial.</text>
<text x="32" y="462" font-size="11" fill="#5c6570" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="1">WAITER: LONG-TERM CURVE (ILLUSTRATIVE)</text>
<path d="M32 600 H388" fill="none" stroke="#5c6570" stroke-width="1.1" marker-end="url(#ar-5c6570)"/>
<path d="M32 600 V474" fill="none" stroke="#5c6570" stroke-width="1.1"/>
<text x="388" y="620" font-size="12" fill="#5c6570" text-anchor="end">time</text>
<path d="M40 590 C 150 586, 260 560, 380 496" fill="none" stroke="#aecbdd" stroke-width="2"/>
<text x="382" y="486" font-size="13" fill="#aecbdd" font-weight="600" text-anchor="end">work done ↑</text>
<path d="M40 566 C 150 564, 260 566, 380 563" fill="none" stroke="#5c6570" stroke-width="2" stroke-dasharray="5 5"/>
<text x="382" y="586" font-size="13" fill="#5c6570" font-weight="600" text-anchor="end">independent ability →</text>
<text x="512" y="462" font-size="11" fill="#5c6570" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="1">COACH: LONG-TERM CURVE (ILLUSTRATIVE)</text>
<path d="M512 600 H868" fill="none" stroke="#5c6570" stroke-width="1.1" marker-end="url(#ar-5c6570)"/>
<path d="M512 600 V474" fill="none" stroke="#5c6570" stroke-width="1.1"/>
<text x="868" y="620" font-size="12" fill="#5c6570" text-anchor="end">time</text>
<path d="M520 500 C 630 506, 740 548, 860 568" fill="none" stroke="#5c6570" stroke-width="2" stroke-dasharray="5 5"/>
<text x="862" y="588" font-size="13" fill="#5c6570" font-weight="600" text-anchor="end">time spent ↓</text>
<path d="M520 590 C 630 584, 740 540, 860 492" fill="none" stroke="#a78bfa" stroke-width="2"/>
<text x="862" y="482" font-size="13" fill="#a78bfa" font-weight="600" text-anchor="end">independent ability ↑</text>
<text x="450" y="652" font-size="14" fill="#e8eaec" text-anchor="middle">A coach's mission isn't to be needed forever, but to keep raising your ability to do without one.</text>
</svg>
