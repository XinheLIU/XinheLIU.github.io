<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" role="img" aria-labelledby="t d" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
<title id="t">The lifecycle of one important choice</title>
<desc id="d">Which stages does an important choice pass through, from writing down the expectation to revising the model, and which product handles each? Six stages form a closed loop, and the record is append-only, never overwritten.</desc>
