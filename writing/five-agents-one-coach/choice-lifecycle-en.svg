<rect x="342" y="146" width="216" height="76" rx="6" fill="#101318" stroke="#e3c99a" stroke-width="1.3"/>
<text x="358.0" y="172.0" font-size="15" font-weight="600" fill="#e8eaec"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#e3c99a" font-weight="400" font-size="13">01</tspan><tspan dx="8">State expectation</tspan></text>
<text x="358" y="193" font-size="13" fill="#9aa3ad">what do I expect?</text>
<text x="358" y="212" font-size="11" fill="#aecbdd" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">WA claim · Compass hypothesis</text>
<rect x="601.808" y="230" width="216" height="76" rx="6" fill="#101318" stroke="#3d444d" stroke-width="1.3"/>
<text x="617.8" y="256.0" font-size="15" font-weight="600" fill="#e8eaec"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#e3c99a" font-weight="400" font-size="13">02</tspan><tspan dx="8">Record the basis</tspan></text>
<text x="617.808" y="277" font-size="13" fill="#9aa3ad">why do I believe it?</text>
<text x="617.808" y="296" font-size="11" fill="#aecbdd" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">AKB sources · IA evidence</text>
<rect x="601.808" y="398" width="216" height="76" rx="6" fill="#101318" stroke="#3d444d" stroke-width="1.3"/>
<text x="617.8" y="424.0" font-size="15" font-weight="600" fill="#e8eaec"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#e3c99a" font-weight="400" font-size="13">03</tspan><tspan dx="8">Counter-evidence</tspan></text>
<text x="617.808" y="445" font-size="13" fill="#9aa3ad">where could it be wrong?</text>
<text x="617.808" y="464" font-size="11" fill="#aecbdd" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">IA counterevidence · WA review</text>
