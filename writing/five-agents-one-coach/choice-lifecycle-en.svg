<text x="50" y="40" font-size="12" fill="#e3c99a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="2">FIG · IMPORTANT CHOICES</text>
<text x="32" y="72" font-size="21" font-weight="600" fill="#e8eaec">The lifecycle of one important choice</text>
