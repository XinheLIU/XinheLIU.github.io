<text x="358" y="529" font-size="13" fill="#9aa3ad">what will I do?</text>
<text x="358" y="548" font-size="11" fill="#aecbdd" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Compass action</text>
<rect x="82.1924" y="398" width="216" height="76" rx="6" fill="#101318" stroke="#3d444d" stroke-width="1.3"/>
<text x="98.2" y="424.0" font-size="15" font-weight="600" fill="#e8eaec"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#e3c99a" font-weight="400" font-size="13">05</tspan><tspan dx="8">Get feedback</tspan></text>
<text x="98.1924" y="445" font-size="13" fill="#9aa3ad">what actually happened?</text>
<text x="98.1924" y="464" font-size="11" fill="#aecbdd" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">LOS tests · Compass market</text>
<rect x="82.1924" y="230" width="216" height="76" rx="6" fill="#101318" stroke="#e3c99a" stroke-width="1.3"/>
<text x="98.2" y="256.0" font-size="15" font-weight="600" fill="#e8eaec"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#e3c99a" font-weight="400" font-size="13">06</tspan><tspan dx="8">Revise the model</tspan></text>
<text x="98.1924" y="277" font-size="13" fill="#9aa3ad">what did I learn?</text>
<text x="98.1924" y="296" font-size="11" fill="#aecbdd" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">AKB view history</text>
<path d="M380 284 V328 A70 15 0 0 0 520 328 V284" fill="#101318" stroke="#e3c99a" stroke-width="1.4"/>
<ellipse cx="450" cy="284" rx="70" ry="15" fill="#e3c99a" fill-opacity="0.16" stroke="#e3c99a" stroke-width="1.4"/>
<text x="450" y="372" font-size="17" fill="#e3c99a" font-weight="700" text-anchor="middle">Important choices</text>
<text x="450" y="394" font-size="13" fill="#9aa3ad" text-anchor="middle">append-only, never overwritten</text>
<text x="450" y="418" font-size="12.5" fill="#5c6570" text-anchor="middle">few · traced to a model</text>
<text x="450" y="436" font-size="12.5" fill="#5c6570" text-anchor="middle">reviewed to correct the model</text>
<text x="450" y="604" font-size="11.5" fill="#5c6570" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">IA = Information Assistant · AKB = Agentic Knowledge Bank · LOS = Learning OS · WA = Writing Assistant</text>
<text x="450" y="630" font-size="13.5" fill="#e8eaec" text-anchor="middle">Five products, different stages, one knowledge base: that matters far more than a shared user profile.</text>
</svg>
