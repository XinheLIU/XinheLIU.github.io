<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t d" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
<title id="t">每往上一层，反馈更昂贵，也更真实</title>
<desc id="d">学习的五层差在哪里？沿阶梯往上，人暴露在“被证明是错的”风险里越来越深，有权说你错的人也越来越多。</desc>
<defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1" fill="#1a1f26"/></pattern></defs>
<rect width="900" height="600" rx="12" fill="#0b0d10"/>
<rect width="900" height="600" rx="12" fill="url(#dots)"/>
<rect x="0.5" y="0.5" width="899" height="599" rx="12" fill="none" stroke="#2a2f36"/>
<rect x="32" y="31" width="9" height="9" fill="none" stroke="#4fd1c5"/>
<text x="50" y="40" font-size="12" fill="#4fd1c5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="2">FIG 2 · 五级学习阶梯</text>
<text x="32" y="72" font-size="21" font-weight="600" fill="#e8eaec">每往上一层，反馈更昂贵，也更真实</text>
