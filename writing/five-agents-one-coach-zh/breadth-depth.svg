<text x="236" y="358" font-size="13" fill="#4fd1c5">广度：走向世界</text>
<text x="393" y="225" font-size="13" fill="#4fd1c5">深度：回到洞穴</text>
<rect x="600" y="112" width="268" height="86" rx="6" fill="#101318" stroke="#2a2f36" stroke-width="1"/>
<rect x="600" y="112" width="3" height="86" fill="#4fd1c5"/>
<text x="618" y="140" font-size="16" fill="#4fd1c5" font-weight="600">广度 · 走向世界</text>
<text x="618" y="164" font-size="14" fill="#9aa3ad">接触材料，让不同框架碰撞</text>
<text x="618" y="184" font-size="13" fill="#5c6570">退化形态：信息消费</text>
<rect x="600" y="212" width="268" height="86" rx="6" fill="#101318" stroke="#2a2f36" stroke-width="1"/>
<rect x="600" y="212" width="3" height="86" fill="#aecbdd"/>
<text x="618" y="240" font-size="16" fill="#aecbdd" font-weight="600">深度 · 回到洞穴</text>
<text x="618" y="264" font-size="14" fill="#9aa3ad">筛选输入，沿一个问题追问到底</text>
<text x="618" y="284" font-size="13" fill="#5c6570">退化形态：自洽却脱离现实</text>
<rect x="600" y="312" width="268" height="108" rx="6" fill="#101318" stroke="#2a2f36" stroke-width="1"/>
<rect x="600" y="312" width="3" height="108" fill="#e3c99a"/>
<text x="618" y="340" font-size="16" fill="#e3c99a" font-weight="600">AI 的偏置</text>
<text x="618" y="364" font-size="14" fill="#9aa3ad">横向一步变得极便宜</text>
<text x="618" y="386" font-size="14" fill="#9aa3ad">纵向一步更容易被跳过</text>
<text x="618" y="406" font-size="13" fill="#5c6570">能看懂答案 ≠ 能独立重建推理</text>
<rect x="32" y="512" width="836" height="44" rx="4" fill="#101318" stroke="#2a2f36" stroke-width="1"/>
<rect x="32" y="512" width="3" height="44" fill="#4fd1c5"/>
<text x="52" y="539.4" font-size="15" fill="#e8eaec">没有广度的深度容易变成局部最优；没有深度的广度只是高级的信息消费。</text>
</svg>
