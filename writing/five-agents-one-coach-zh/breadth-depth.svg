<rect x="32" y="31" width="9" height="9" fill="none" stroke="#4fd1c5"/>
<text x="50" y="40" font-size="12" fill="#4fd1c5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="2">FIG · 广度 × 深度</text>
<text x="32" y="72" font-size="21" font-weight="600" fill="#e8eaec">只沿一条轴走，都到不了认知</text>
<line x1="32" y1="90" x2="868" y2="90" stroke="#2a2f36"/>
<rect x="325" y="106" width="235" height="181" rx="0" fill="#4fd1c5" stroke="none" stroke-width="0" fill-opacity="0.07"/>
<path d="M325 106 V470" fill="none" stroke="#3d444d" stroke-width="1" stroke-dasharray="3 5"/>
<path d="M90 287 H560" fill="none" stroke="#3d444d" stroke-width="1" stroke-dasharray="3 5"/>
