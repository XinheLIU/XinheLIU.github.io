<path d="M90 470 V110" fill="none" stroke="#5c6570" stroke-width="1.2" marker-end="url(#ar-5c6570)"/>
<text x="560" y="496" font-size="13" fill="#9aa3ad" text-anchor="end">广度</text>
<text x="66" y="288" font-size="13" fill="#9aa3ad" text-anchor="middle" transform="rotate(-90 66 288)">深度</text>
<text x="130" y="132" font-size="16" fill="#e3c99a" font-weight="600">局部最优</text>
<text x="130" y="154" font-size="13" fill="#9aa3ad">自洽，却离现实越来越远</text>
<text x="130" y="174" font-size="13" fill="#5c6570">手里有锤子，看什么都像钉子</text>
<text x="548" y="132" font-size="16" fill="#4fd1c5" font-weight="600" text-anchor="end">结构性判断</text>
<text x="548" y="154" font-size="13" fill="#9aa3ad" text-anchor="end">可迁移 · 可修正</text>
<text x="548" y="174" font-size="13" fill="#5c6570" text-anchor="end">T 字型认知</text>
<text x="345" y="320" font-size="16" fill="#e07a6b" font-weight="600">信息消费</text>
<text x="345" y="342" font-size="13" fill="#9aa3ad">接触得多 ≠ 理解得深</text>
<text x="345" y="362" font-size="13" fill="#5c6570">读完十本书的摘要</text>
<path d="M110 450 H536" fill="none" stroke="#e07a6b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#ar-e07a6b)"/>
<text x="450" y="440" font-size="13" fill="#e07a6b" text-anchor="middle">有广无深</text>
<path d="M110 450 V128" fill="none" stroke="#e3c99a" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#ar-e3c99a)"/>
<text x="122" y="236" font-size="13" fill="#e3c99a">有深无广</text>
